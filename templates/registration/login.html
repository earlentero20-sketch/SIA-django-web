<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockEase | Log In</title>
    <style>
        :root { --ink: #173042; --muted: #6d7e86; --paper: #f5f7f4; --line: #dce5e1; --teal: #087f73; --coral: #e76f51; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--paper); color: var(--ink); font: 15px Georgia, serif; }
        header { background: var(--ink); color: white; padding: 28px max(24px, calc((100% - 760px) / 2)); }
        h1 { margin: 0; font-size: 30px; }
        main { max-width: 760px; margin: 0 auto; padding: 42px 24px; }
        .card { background: white; border: 1px solid var(--line); padding: 28px; }
        h2 { margin: 0 0 10px; }
        p { color: var(--muted); margin-bottom: 22px; }
        form { display: grid; gap: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 7px; }
        input { width: 100%; border: 1px solid #b9c9c4; padding: 12px; font: inherit; }
        input:focus { outline: 2px solid var(--teal); border-color: var(--teal); }
        button { border: 0; background: var(--coral); color: white; padding: 12px 20px; font: inherit; font-weight: bold; cursor: pointer; }
        .errorlist { color: var(--coral); list-style: none; margin: 0; padding: 0; }
        .back { display: inline-block; margin-bottom: 20px; color: var(--teal); text-decoration: none; }
        .register { margin: 20px 0 0; }
        .register a { color: var(--teal); font-weight: bold; }
    </style>
</head>
<body>
    <header><h1>StockEase</h1></header>
    <main>
        <a class="back" href="{% url 'product-list' %}">&larr; Back to inventory</a>
        <div class="card">
            <h2>Log In</h2>
            <p>Use your account to access the inventory dashboard.</p>
            {% if messages %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Log In</button>
            </form>
            <p class="register">Don't have an account? <a href="{% url 'register' %}">Create account</a></p>
        </div>
    </main>
</body>
</html>
