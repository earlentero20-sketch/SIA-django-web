<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StockEase | Remove Product</title><style>:root{--ink:#173042;--paper:#f5f7f4;--coral:#e76f51;--teal:#087f73}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px Georgia,serif}header{background:var(--ink);color:#fff;padding:28px max(24px,calc((100% - 600px)/2))}h1{margin:0;font-size:30px}main{max-width:600px;margin:0 auto;padding:60px 24px}section{background:#fff;border:1px solid #dce5e1;padding:30px}h2{margin-top:0;font-size:26px}p{line-height:1.6}.warning{color:var(--coral)}button{background:var(--coral);border:0;color:#fff;padding:12px 18px;font:inherit;font-weight:bold;cursor:pointer}.cancel{color:var(--teal);margin-left:16px}</style></head><body><header><h1>StockEase</h1></header><main><section><h2>Remove product?</h2><p>Are you sure you want to remove <strong>{{ product.name }}</strong> from the inventory?</p><p class="warning">This action cannot be undone.</p><form method="post">{% csrf_token %}<button type="submit">Remove Product</button><a class="cancel" href="{% url 'product-list' %}">Cancel</a></form></section></main></body></html>
