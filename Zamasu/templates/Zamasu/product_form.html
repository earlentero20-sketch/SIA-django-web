<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StockEase | {{ title }}</title>
    <style>
        :root { --ink: #173042; --muted: #6d7e86; --paper: #f5f7f4; --line: #dce5e1; --teal: #087f73; --coral: #e76f51; } * { box-sizing: border-box; }
        body { margin: 0; color: var(--ink); background: var(--paper); font: 15px Georgia, serif; } header { background: var(--ink); color: white; padding: 28px max(24px, calc((100% - 760px) / 2)); } h1, h2, p { margin: 0; } h1 { font-size: 30px; } main { max-width: 760px; margin: 0 auto; padding: 42px 24px; } .back { color: var(--teal); display: inline-block; margin-bottom: 22px; } h2 { font-size: 26px; margin-bottom: 7px; } .muted { color: var(--muted); margin-bottom: 25px; }
        form { background: white; border: 1px solid var(--line); padding: 28px; } .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } label { display: block; font-weight: bold; margin-bottom: 7px; } input { width: 100%; border: 1px solid #b9c9c4; padding: 12px; font: inherit; color: var(--ink); } input:focus { outline: 2px solid var(--teal); border-color: var(--teal); } .field { margin-bottom: 4px; } .errorlist { color: var(--coral); padding: 0; margin: 6px 0 0; list-style: none; } .buttons { display: flex; gap: 16px; align-items: center; margin-top: 28px; } button { border: 0; background: var(--coral); color: white; padding: 12px 20px; font: inherit; font-weight: bold; cursor: pointer; } .cancel { color: var(--teal); }
        @media (max-width: 600px) { main { padding: 28px 16px; } form { padding: 20px; } .grid { grid-template-columns: 1fr; gap: 0; } .field { margin-bottom: 18px; } }
    </style>
</head>
<body><header><h1>StockEase</h1></header><main>
    <a class="back" href="{% url 'product-list' %}">&larr; Back to inventory</a><h2>{{ title }}</h2><p class="muted">Enter the product details below.</p>
    <form method="post">{% csrf_token %}<div class="grid">{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="buttons"><button type="submit">Save Product</button><a class="cancel" href="{% url 'product-list' %}">Cancel</a></div></form>
</main></body></html>
